<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sushy Skin Editor</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cedarville+Cursive&family=Honk:MORF@15&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 5px;
            background: #0e0e0e;
            color: #ffffff;
            font-family: "Cedarville Cursive", cursive;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #sidebar {
            width: 360px;
            flex: 0 0 360px;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.58), rgba(24, 14, 21, 0.58));
            padding: 25px;
            margin: 12px;
            border-radius: 20px;
            border: 1px solid rgba(253, 88, 185, 0.2);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 10;
        }
        #viewer-container {
            position: fixed;
            inset: 0;
            flex-grow: 1;
            z-index: 0;
        }
        #viewer-message {
            position: absolute;
            inset: 20px;
            display: grid;
            place-items: center;
            color: #ffffff;
            font: 14px/1.5 "Google Sans Flex", sans-serif;
            text-align: center;
            white-space: pre-line;
            pointer-events: none;
        }
        #viewer-message[hidden] {
            display: none;
        }
        h2 { 
            font-size: 45px; 
            margin-top: 0px; 
            color: #ee0909;
            font-family: "Honk", system-ui;
            text-align: center;
            margin-bottom: 0px; 
        }
        @font-palette-values --title-green {
            font-family: "Honk";
            override-colors: 2 #eaffb0, 3 #b5f58c, 4 #6fe08a, 5 #3cc97e, 6 #1fb37a, 7 #1fb37a;
        }
        @font-palette-values --title-blue {
            font-family: "Honk";
            override-colors: 2 #d9f0ff, 3 #a8d4ff, 4 #78b4ff, 5 #4d90f5, 6 #3a6de0, 7 #3a6de0;
        }
        @font-palette-values --title-red {
            font-family: "Honk";
            override-colors: 2 #ffe9b0, 3 #ffc080, 4 #ff8f6a, 5 #ff5a50, 6 #e83030, 7 #e83030;
        }
        @font-palette-values --title-grey {
            font-family: "Honk";
            override-colors: 2 #f5f5f5, 3 #dcdce0, 4 #bdbdc4, 5 #9e9ea6, 6 #80808a, 7 #80808a;
        }
        @font-palette-values --title-purple {
            font-family: "Honk";
            override-colors: 2 #f0dcff, 3 #d9b4ff, 4 #bb8cff, 5 #9c64f0, 6 #7e45d6, 7 #7e45d6;
        }
        @font-palette-values --title-orange {
            font-family: "Honk";
            override-colors: 2 #fff0b0, 3 #ffd27a, 4 #ffaa4d, 5 #ff8a2a, 6 #e8680f, 7 #e8680f;
        }
        .author-text {
            font-size: 25px; 
            color: rgb(253, 88, 185);
            opacity: 0.8;
            margin-top: -10px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Species Selection Style */
        .select-container {
            min-width: 0;
            margin-bottom: 20px;
            text-align: left;
        }
        .select-container label {
            font-family: "Google Sans Flex", sans-serif;
            font-size: 14px;
            color: rgb(253, 88, 185);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }
        .species-dropdown {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.52), rgba(24, 14, 21, 0.52));
            border: 1px solid rgba(253, 88, 185, 0.16);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            opacity: 0.62;
            color-scheme: dark;
            color: #ffebb3;
            padding: 10px;
            border-radius: 12px;
            font-family: "Google Sans Flex", sans-serif;
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .species-dropdown:hover:not(:disabled),
        .species-dropdown:focus-visible {
            opacity: 1;
            border-color: rgba(253, 88, 185, 0.9);
            box-shadow: 0 0 20px rgba(253, 88, 185, 0.38), 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        .species-dropdown option {
            background: #1c111a;
            color: #ffebb3;
        }
        .species-dropdown option:checked,
        .species-dropdown option:hover {
            background: #5a1f45 linear-gradient(0deg, #5a1f45, #5a1f45);
            color: #ffebb3;
        }
        @supports (appearance: base-select) {
            .species-dropdown,
            .species-dropdown::picker(select) {
                appearance: base-select;
            }
            .species-dropdown {
                min-height: 42px;
                padding: 10px;
            }
            .species-dropdown::picker-icon {
                color: #fd58b9;
                transition: rotate 0.2s ease;
            }
            .species-dropdown:open::picker-icon {
                rotate: 180deg;
            }
            .species-dropdown::picker(select) {
                box-sizing: border-box;
                max-height: 320px;
                margin-top: 6px;
                padding: 6px;
                color: #ffebb3;
                background: linear-gradient(145deg, rgba(37, 24, 33, 0.96), rgba(24, 14, 21, 0.96));
                border: 1px solid rgba(253, 88, 185, 0.9);
                border-radius: 12px;
                box-shadow: 0 0 20px rgba(253, 88, 185, 0.38), 0 4px 18px rgba(0, 0, 0, 0.45);
                font-family: "Google Sans Flex", sans-serif;
                font-size: 14px;
            }
            .species-dropdown option {
                padding: 8px 10px;
                border-radius: 8px;
                background: transparent;
                color: #ffebb3;
                font-family: "Google Sans Flex", sans-serif;
                cursor: pointer;
            }
            .species-dropdown option::checkmark {
                color: #fd58b9;
            }
            .species-dropdown option:hover,
            .species-dropdown option:focus,
            .species-dropdown option:checked {
                background: rgba(253, 88, 185, 0.22);
                color: #ffebb3;
            }
        }

        /* Only the control zones container scrolls */
        #controls-container {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 5px;
            min-width: 0;
        }

        /* Modern design for dynamic zone groups */
        .zone-group {
            min-width: 0;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.52), rgba(24, 14, 21, 0.52));
            padding: 0;
            margin-bottom: 12px;
            border-radius: 12px;
            border: 1px solid rgba(253, 88, 185, 0.16);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            text-align: left;
            opacity: 0.62;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .zone-group:hover,
        .zone-group:focus-within {
            opacity: 1;
            border-color: rgba(253, 88, 185, 0.9);
            box-shadow: 0 0 20px rgba(253, 88, 185, 0.38), 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        #backgroundControls .zone-group {
            margin: 0;
            background: none;
            border: 0;
            box-shadow: none;
            backdrop-filter: none;
            opacity: 1;
        }
        .zone-group.is-disabled {
            opacity: 0.35;
            filter: saturate(0.45);
        }
        .zone-group.is-disabled > summary {
            cursor: not-allowed;
        }
        .zone-group.is-disabled:hover,
        .zone-group.is-disabled:focus-within {
            opacity: 0.35;
            border-color: rgba(253, 88, 185, 0.16);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }
        .zone-group > summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px;
            cursor: pointer;
            list-style: none;
            font-family: "Google Sans Flex", sans-serif;
        }
        .zone-group > summary::-webkit-details-marker {
            display: none;
        }
        .zone-group > summary::after {
            content: '+';
            color: #ffebb3;
            font-size: 25px;
        }
        .zone-group[open] > summary::after {
            content: '−';
        }
        .zone-preview {
            width: 28px;
            height: 22px;
            margin-left: auto;
            flex: 0 0 40px;
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 5px;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.2);
        }
        .rgb-control-body.hide-rgb-fields > label.zone-title,
        .rgb-control-body.hide-rgb-fields > .rgb-fields {
            display: none;
        }
        .rgb-control-body {
            padding: 0 14px 14px;
        }
        html:not(.win95) .clippy-agent {
            display: none !important;
        }
        .color-tools {
            display: flex;
            gap: 8px;
            margin: 8px 0 4px;
        }
        .color-tools button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 34px;
            padding: 0;
            background: rgba(10, 5, 8, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fd58b9;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }
        .color-tools button:hover:not(:disabled) {
            border-color: #fd58b9;
        }
        .color-tools button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .color-tools button.tool-done {
            border-color: #7ee787;
            background: rgba(126, 231, 135, 0.18);
        }
        html.win95 .color-tools button {
            border: 0;
            border-radius: 0;
            background: #c0c0c0;
            box-shadow: var(--w-raised);
            color: #000;
        }
        html.win95 .color-tools button:active:not(:disabled) {
            box-shadow: var(--w-sunken);
        }
        html.win95 .color-tools button:disabled {
            color: #808080;
            opacity: 1;
        }
        .zone-title {
            color: #ffebb3;
            font-size: 18px;
            font-family: "Google Sans Flex", sans-serif;
            font-weight: normal;
        }
        .rgb-control-body > label {
            display: block;
            font-size: 14px;
            margin-top: 6px;
            margin-bottom: 8px;
            color: #fd58b9;
            opacity: 0.55;
            font-family: "Google Sans Flex", sans-serif;
            font-weight: light;
            line-height: normal;
            letter-spacing: normal;
            text-transform: none;
        }
        .zone-group input {
            width: 100%;
            background: rgba(10, 5, 8, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px;
            box-sizing: border-box;
            border-radius: 8px;
            font-family: "Google Sans Flex", sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }
        .zone-group input:focus {
            border-color: #fd58b9;
        }
        .rgb-fields {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 2px;
        }
        .rgb-fields label {
            min-width: 0;
            margin: 0;
            font-size: 15px;
            font-family: "Google Sans Flex", sans-serif;
            color: #fd58b9;
            text-align: center;
        }
        .rgb-fields input {
            min-width: 0;
            padding: 10px 6px;
            text-align: center;
        }
        .rgb-number-control {
            display: flex;
            align-items: stretch;
            gap: 2px;
            min-width: 0;
        }
        .rgb-fields input[type="number"] {
            color: #ffebb3;
            padding-right: 2px;
            padding-left: 2px;
            font-size: 15px;
            -moz-appearance: textfield;
            appearance: textfield;
        }
        .rgb-fields input[type="number"]::-webkit-inner-spin-button,
        .rgb-fields input[type="number"]::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }
        .rgb-number-buttons {
            display: flex;
            flex-direction: column;
            flex: 0 0 18px;
            gap: 2px;
        }
        .rgb-number-buttons button {
            position: relative;
            flex: 1;
            min-height: 0;
            padding: 0;
            border: 1px solid rgba(253, 88, 185, 0.4);
            border-radius: 3px;
            background: rgba(253, 88, 185, 0.14);
            cursor: pointer;
        }
        .rgb-number-buttons button:hover,
        .rgb-number-buttons button:focus-visible {
            border-color: #fd58b9;
            background: rgba(253, 88, 185, 0.3);
            outline: none;
        }
        .rgb-number-buttons button::after {
            position: absolute;
            left: 50%;
            width: 0;
            height: 0;
            content: "";
            transform: translateX(-50%);
            border-right: 4px solid transparent;
            border-left: 4px solid transparent;
        }
        .rgb-number-buttons .increment::after {
            top: 2px;
            border-bottom: 4px solid #fd58b9;
        }
        .rgb-number-buttons .decrement::after {
            bottom: 2px;
            border-top: 4px solid #fd58b9;
        }
        .disk-picker {
            display: block;
            width: 180px;
            height: 180px;
            max-width: 100%;
            margin: 12px auto 4px;
            cursor: crosshair;
            touch-action: none;
        }
        .brightness-control {
            display: grid;
            grid-template-columns: auto 1fr;
            align-items: center;
            gap: 10px;
            color: #bbb;
            font: 18px "Google Sans Flex", sans-serif;
        }
        .zone-group .brightness-control input {
            padding: 0;
        }
        .brightness-control input[type="range"] {
            appearance: none;
            height: 18px;
            border: 0;
            background: transparent;
        }
        .brightness-control input[type="range"]::-webkit-slider-runnable-track {
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(to right, #000000, var(--brightness-color, #ffffff));
        }
        .brightness-control input[type="range"]::-moz-range-track {
            height: 8px;
            border-radius: 999px;
            background: linear-gradient(to right, #000000, var(--brightness-color, #ffffff));
        }
        .brightness-control input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 14px;
            height: 14px;
            margin-top: -3px;
            border: 2px solid #fff;
            border-radius: 50%;
            background: #fd58b9;
        }
        .brightness-control input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: 2px solid #ffebb3;
            border-radius: 50%;
            background: #fd58b9;
        }
        .gender-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .gender-selector button {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(253, 88, 185, 0.4);
            border-radius: 8px;
            background: #1a1015;
            color: #ffebb3;
            font: 18px "Google Sans Flex", sans-serif;
            cursor: pointer;
        }
        .gender-selector .mdi {
            width: 24px;
            height: 24px;
            vertical-align: middle;
        }
        .gender-selector #maleButton[aria-pressed="true"] {
            border-color: rgba(126, 202, 255, 0.9);
            background: rgba(126, 202, 255, 0.2);
            color: #b8e3ff;
            box-shadow: 0 0 14px rgba(126, 202, 255, 0.32);
        }
        .gender-selector #femaleButton[aria-pressed="true"] {
            border-color: rgba(253, 88, 185, 0.9);
            background: rgba(253, 88, 185, 0.2);
            color: #ffb5d9;
            box-shadow: 0 0 14px rgba(253, 88, 185, 0.32);
        }
        .growth-control {
            margin: 0 0 16px;
            padding: 10px 12px 9px;
            border: 1px solid rgba(255, 235, 179, 0.16);
            border-radius: 9px;
            background: linear-gradient(135deg, rgba(255, 235, 179, 0.07), rgba(253, 88, 185, 0.06));
            color: #ffebb3;
            font-family: "Google Sans Flex", sans-serif;
        }
        .growth-control-heading,
        .growth-control-range {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .growth-control-heading {
            margin-bottom: 5px;
            font-size: 12px;
            letter-spacing: 0.04em;
        }
        .growth-control-heading output {
            color: #ffb5d9;
            font-weight: 600;
            text-align: right;
        }
        .growth-control input[type="range"] {
            display: block;
            width: 100%;
            height: 18px;
            margin: 0;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        .growth-control input[type="range"]::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 235, 179, 0.5), #fd58b9);
        }
        .growth-control input[type="range"]::-moz-range-track {
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(255, 235, 179, 0.5), #fd58b9);
        }
        .growth-control input[type="range"]::-webkit-slider-thumb {
            width: 14px;
            height: 14px;
            margin-top: -5px;
            appearance: none;
            border: 2px solid #ffebb3;
            border-radius: 50%;
            background: #fd58b9;
            box-shadow: 0 0 8px rgba(253, 88, 185, 0.45);
        }
        .growth-control input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: 2px solid #ffebb3;
            border-radius: 50%;
            background: #fd58b9;
            box-shadow: 0 0 8px rgba(253, 88, 185, 0.45);
        }
        .growth-control-range {
            color: rgba(255, 235, 179, 0.62);
            font-size: 10px;
        }
        #topTools {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 30;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font: 13px "Google Sans Flex", sans-serif;
        }
        .lighting-controls {
            position: relative;
            color: #ffebb3;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.48), rgba(24, 14, 21, 0.48));
            border: 1px solid rgba(253, 88, 185, 0.16);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            opacity: 0.58;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .lighting-controls:hover,
        .lighting-controls:focus-within {
            opacity: 1;
            border-color: rgba(253, 88, 185, 0.9);
            box-shadow: 0 0 20px rgba(253, 88, 185, 0.3), 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        .lighting-controls > summary {
            display: grid;
            width: 40px;
            height: 40px;
            box-sizing: border-box;
            place-items: center;
            color: #ffebb3;
            cursor: pointer;
            list-style: none;
        }
        .lighting-controls > summary::-webkit-details-marker {
            display: none;
        }
        .lighting-controls > summary .mdi {
            width: 22px;
            height: 22px;
            color: currentColor;
        }
        #animationToggleButton,
        #themeToggleButton,
        #win95ToggleButton {
            display: grid;
            width: 42px;
            height: 42px;
            box-sizing: border-box;
            place-items: center;
            padding: 0;
            color: #ffebb3;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.48), rgba(24, 14, 21, 0.48));
            border: 1px solid rgba(253, 88, 185, 0.16);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            opacity: 0.58;
            cursor: pointer;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        #animationToggleButton:hover:not(:disabled),
        #animationToggleButton:focus-visible,
        #themeToggleButton:hover,
        #themeToggleButton:focus-visible,
        #win95ToggleButton:hover,
        #win95ToggleButton:focus-visible {
            opacity: 1;
            border-color: rgba(253, 88, 185, 0.9);
            box-shadow: 0 0 20px rgba(253, 88, 185, 0.3), 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        #animationToggleButton:disabled {
            cursor: not-allowed;
            opacity: 0.32;
        }
        #animationToggleButton .mdi,
        #themeToggleButton .mdi,
        #win95ToggleButton .mdi {
            width: 22px;
            height: 22px;
        }
        .lighting-controls-body {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            display: grid;
            width: min(280px, calc(100vw - 28px));
            box-sizing: border-box;
            gap: 8px;
            padding: 14px;
            color: #ffebb3;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.52), rgba(24, 14, 21, 0.52));
            border: 1px solid rgba(253, 88, 185, 0.16);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            font: 12px "Google Sans Flex", sans-serif;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .lighting-controls:hover > .lighting-controls-body,
        .lighting-controls:focus-within > .lighting-controls-body {
            border-color: rgba(253, 88, 185, 0.9);
            box-shadow: 0 0 20px rgba(253, 88, 185, 0.38), 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        .lighting-controls:not([open]) .lighting-controls-body {
            display: none;
        }
        .lighting-controls-body label {
            color: #fd58b9;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }
        .lighting-controls-body input[type="range"] {
            width: 100%;
            height: 18px;
            margin: 0;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        .lighting-controls-body input[type="range"]::-webkit-slider-runnable-track {
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #fd58b9, #ffebb3);
        }
        .lighting-controls-body input[type="range"]::-moz-range-track {
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, #fd58b9, #ffebb3);
        }
        .lighting-controls-body input[type="range"]::-webkit-slider-thumb {
            width: 14px;
            height: 14px;
            margin-top: -5px;
            appearance: none;
            border: 2px solid #ffebb3;
            border-radius: 50%;
            background: #fd58b9;
            box-shadow: 0 0 8px rgba(253, 88, 185, 0.45);
        }
        .lighting-controls-body input[type="range"]::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border: 2px solid #ffebb3;
            border-radius: 50%;
            background: #fd58b9;
            box-shadow: 0 0 8px rgba(253, 88, 185, 0.45);
        }
        .lighting-controls-body output {
            color: #ffebb3;
            font-variant-numeric: tabular-nums;
        }
        .preset-panel {
            position: relative;
            width: min(320px, calc(100vw - 28px));
            min-width: 0;
            max-width: min(320px, calc(100vw - 28px));
            box-sizing: border-box;
            color: #ffebb3;
            background: linear-gradient(145deg, rgba(37, 24, 33, 0.52), rgba(24, 14, 21, 0.52));
            border: 1px solid rgba(253, 88, 185, 0.16);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(4px);
            opacity: 0.62;
            font: 13px "Google Sans Flex", sans-serif;
            transition: opacity 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .preset-panel:hover,
        .preset-panel:focus-within {
            opacity: 1;
            border-color: rgba(253, 88, 185, 0.9);
            box-shadow: 0 0 20px rgba(253, 88, 185, 0.38), 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        .preset-panel > summary {
            padding: 11px 14px;
            color: #ffebb3;
            cursor: pointer;
            font-weight: bold;
            list-style: none;
        }
        .preset-panel > summary::-webkit-details-marker {
            display: none;
        }
        .preset-panel > summary::after {
            content: '+';
            float: right;
            font-size: 17px;
        }
        .preset-panel[open] > summary::after {
            content: '−';
        }
        .preset-panel-content {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 12px;
            max-height: min(72vh, 620px);
            overflow-x: hidden;
            overflow-y: auto;
            padding: 0 12px 12px;
        }
        .preset-panel-content > *,
        .preset-card > * {
            min-width: 0;
            max-width: 100%;
        }
        .preset-card {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 8px;
            padding: 11px;
            border: 1px solid rgba(253, 88, 185, 0.24);
            border-radius: 10px;
            background: rgba(10, 5, 8, 0.4);
        }
        .preset-card h3 {
            margin: 0 0 2px;
            color: #ffebb3;
            font-size: 13px;
        }
        .preset-panel label {
            color: #fd58b9;
            font-size: 11px;
            font-weight: bold;
        }
        .preset-panel input,
        .preset-panel select,
        .preset-panel textarea,
        .preset-panel button {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(253, 88, 185, 0.35);
            border-radius: 7px;
            padding: 8px;
            color: #ffebb3;
            background: rgba(10, 5, 8, 0.82);
            font: 12px "Google Sans Flex", sans-serif;
        }
        .preset-panel textarea {
            min-height: 64px;
            resize: vertical;
            overflow-wrap: anywhere;
        }
        .preset-panel button {
            cursor: pointer;
            background: rgba(253, 88, 185, 0.12);
        }
        .preset-panel button:hover {
            border-color: #fd58b9;
            background: rgba(253, 88, 185, 0.25);
        }
        .preset-actions {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 7px;
        }
        #presetStatus {
            min-height: 16px;
            color: #ffebb3;
            font-size: 11px;
            overflow-wrap: anywhere;
        }
        .preset-help {
            color: rgba(255, 235, 179, 0.75);
            font-size: 11px;
            line-height: 1.4;
        }
        /* Optional Windows 95 look: html.win95 overrides the styles above; the color themes only tint the title bar and selections. */

<body>

    <div id="topTools">
    <button type="button" id="animationToggleButton" aria-label="Pause animation" title="Pause animation" aria-pressed="false" disabled>
        <span id="animationToggleIcon" aria-hidden="true"></span>
    </button>
    <details id="lightingPanel" class="lighting-controls">
        <summary aria-label="Lighting &amp; surface settings" title="Lighting &amp; surface settings">
            <span id="lightingIcon" aria-hidden="true"></span>
        </summary>
        <div class="lighting-controls-body">
            <label for="ambientIntensity">Environment <output id="ambientIntensityValue" for="ambientIntensity">0.50</output></label>
            <input id="ambientIntensity" type="range" min="0" max="3" step="0.05" value="0.5">
            <label for="sunIntensity">Key light <output id="sunIntensityValue" for="sunIntensity">3.00</output></label>
            <input id="sunIntensity" type="range" min="0" max="3" step="0.05" value="3">
            <label for="sunHeight">Light height <output id="sunHeightValue" for="sunHeight">0.20</output></label>
            <input id="sunHeight" type="range" min="0" max="1" step="0.01" value="0.2">
            <label for="fillIntensity">Fill light <output id="fillIntensityValue" for="fillIntensity">0.10</output></label>
            <input id="fillIntensity" type="range" min="0" max="1" step="0.05" value="0.1">
            <label for="skinSpecular">Surface shine <output id="skinSpecularValue" for="skinSpecular">0.10</output></label>
            <input id="skinSpecular" type="range" min="0" max="1" step="0.01" value="0.1">
        </div>
    </details>
    <details id="backgroundPanel" class="lighting-controls">
        <summary aria-label="Background color" title="Background color">
            <span id="backgroundIcon" aria-hidden="true"></span>
        </summary>
        <div class="lighting-controls-body" id="backgroundControls"></div>
    </details>
    <button type="button" id="themeToggleButton" aria-label="Change color theme" title="Change color theme">
        <span id="themeIcon" aria-hidden="true"></span>
    </button>
    <button type="button" id="win95ToggleButton" aria-label="Toggle Windows 95 style" title="Toggle Windows 95 style" aria-pressed="false">
        <span id="win95Icon" aria-hidden="true"></span>
    </button>
    <details id="presetPanel" class="preset-panel">
        <summary>Skin Presets &amp; Codes</summary>
        <div class="preset-panel-content">
            <section class="preset-card" aria-labelledby="savedPresetsHeading">
                <h3 id="savedPresetsHeading">Saved presets</h3>
                <label for="presetName">Preset name</label>
                <input id="presetName" type="text" maxlength="60" placeholder="My skin preset">
                <button type="button" id="savePresetButton">Save current skin</button>
                <label for="savedPresetSelect">Choose a preset</label>
                <select id="savedPresetSelect">
                    <option value="">No saved presets</option>
                </select>
                <div class="preset-actions">
                    <button type="button" id="loadPresetButton">Load preset</button>
                    <button type="button" id="deletePresetButton">Delete preset</button>
                </div>
            </section>
            <section class="preset-card" aria-labelledby="skinCodesHeading">
                <h3 id="skinCodesHeading">Skin codes</h3>
                <label for="skinCodeFormat">Export format</label>
                <select id="skinCodeFormat">
                    <option value="skinhex1">Editor code (SKINHEX1)</option>
                    <option value="extended-rgb">Extended RGB (preserves NERF limit ±1,000,000)</option>
                    <option value="oasis-base64">Oasis code (Base64)</option>
                    <option value="nerf-base64">NERF-compatible code (Base64)</option>
                    <option value="color-hex">Color hex list</option>
                </select>
                <label for="skinCodeOutput">Exported skin code</label>
                <textarea id="skinCodeOutput" readonly placeholder="Generate a code for the current skin"></textarea>
                <div class="preset-actions">
                    <button type="button" id="exportSkinCodeButton">Generate code</button>
                    <button type="button" id="copySkinCodeButton">Copy code</button>
                </div>
                <label for="skinCodeInput">Load skin code</label>
                <textarea id="skinCodeInput" placeholder="Skin JSON, SKINHEX1, Base64 skin code, or hex colors"></textarea>
                <label for="base64PatternNumbering">Base64 pattern numbering</label>
                <select id="base64PatternNumbering">
                    <option value="auto">Auto (0 or 1 = first pattern)</option>
                    <option value="zero-based">Zero-based (NERF)</option>
                    <option value="one-based">One-based (Oasis)</option>
                </select>
                <button type="button" id="loadSkinCodeButton">Apply skin code</button>
            </section>
            <div id="presetStatus" role="status" aria-live="polite"></div>
        </div>
    </details>
    </div>
    
    <div id="sidebar">
        <h2>Skin Editor</h2>
        <p class="author-text">by Sushy</p>
        
        <!-- Species Selector -->
        <div class="select-container">
            <label for="speciesSelect">Species</label>
            <select id="speciesSelect" class="species-dropdown">
                <!-- Dynamically populated -->
            </select>
        </div>

        <div class="select-container">
            <label for="animationSelect">Animation</label>
            <select id="animationSelect" class="species-dropdown" disabled>
                <option value="">Load a model first</option>
            </select>
        </div>

        <div class="select-container">
            <label for="patternSelect">Skin pattern</label>
            <select id="patternSelect" class="species-dropdown" disabled>
                <option value="">Load a model first</option>
            </select>
        </div>

        <div class="gender-selector" role="group" aria-label="Model gender">
            <button type="button" id="maleButton" aria-label="Male" title="Male" aria-pressed="true"></button>
            <button type="button" id="femaleButton" aria-label="Female" title="Female" aria-pressed="false"></button>
        </div>
        <div class="growth-control">
            <div class="growth-control-heading">
                <label for="growthSlider">Growth</label>
                <output id="growthStageValue" for="growthSlider">Adult</output>
            </div>
            <input id="growthSlider" type="range" min="0" max="1" step="0.01" value="0.5"
                aria-label="Model growth stage">
            <div class="growth-control-range" aria-hidden="true">
                <span id="growthStartLabel">Juvenile</span>
                <span id="growthEndLabel">Elder</span>
            </div>
        </div>

        <div id="controls-container">
            <!-- Dynamic Shader Zones -->
        </div>
    </div>

    <div id="viewer-container">
        <div id="viewer-message" role="status" hidden></div>
    </div>

    <script type="module">
        import React from 'react';
        import { createRoot } from 'react-dom/client';
        import Icon from '@mdi/react';
        import * as THREE from 'three';
        import {
            mdiGenderFemale,
            mdiGenderMale,
            mdiLightbulbOn10,
            mdiPanoramaOutline,
            mdiPaletteOutline,
            mdiMicrosoftWindowsClassic,
            mdiPause,
            mdiPlay,
            mdiEyedropper,
            mdiEyedropperPlus,
            mdiWaterOutline,
            mdiWaterCheckOutline,
        } from '@mdi/js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
        import { buildUEAnimationClip, parseUEAnim } from './ueanim.js';

        console.log("Starting Glitched Skin Editor...");

        createRoot(document.getElementById('lightingIcon')).render(

            const lowerIndex = Math.floor(position);
            const upperIndex = Math.min(lowerIndex + 1, currentGrowthStages.length - 1);
            const blend = position - lowerIndex;
            const label = blend < 0.01 || lowerIndex === upperIndex
                ? currentGrowthStages[lowerIndex]
                : `${currentGrowthStages[lowerIndex]} → ${currentGrowthStages[upperIndex]}`;
            growthStageValue.value = label;
            growthSlider.setAttribute('aria-valuetext', label);
            growthStartLabel.textContent = currentGrowthStages[0];
            growthEndLabel.textContent = currentGrowthStages[currentGrowthStages.length - 1];
        }

        function applyGrowthMorphs() {
            const position = growthValue * Math.max(currentGrowthStages.length - 1, 0);
            const lowerIndex = Math.floor(position);
            const upperIndex = Math.min(lowerIndex + 1, currentGrowthStages.length - 1);
            const blend = position - lowerIndex;
            const stageWeights = new Map();
            if (lowerIndex === upperIndex) {
                stageWeights.set(currentGrowthStages[lowerIndex], 1);
            } else {
                stageWeights.set(currentGrowthStages[lowerIndex], 1 - blend);
                stageWeights.set(currentGrowthStages[upperIndex], blend);
            }

            growthMeshes.forEach(mesh => {
                const { morphTargetDictionary, morphTargetInfluences } = mesh;
                if (!morphTargetDictionary || !morphTargetInfluences) return;
                Object.entries(morphTargetDictionary).forEach(([name, index]) => {
                    if (name === 'Female') {
                        morphTargetInfluences[index] = isFemale ? 1 : 0;
                    } else if (growthStageOrder.includes(name)) {
                        morphTargetInfluences[index] = stageWeights.get(name) || 0;
                    }

            });

            picker.className = 'disk-picker';

            picker.setAttribute('aria-label', `${label} color disk`);
            const pickerContext = picker.getContext('2d');
            const brightnessLabel = document.createElement('label');
            brightnessLabel.className = 'brightness-control';
            const brightnessText = document.createElement('span');
            brightnessText.textContent = 'Brightness';

            brightness.type = 'range';

            brightness.max = '1';
            brightness.step = '0.01';
            brightness.setAttribute('aria-label', `${label} brightness`);
            brightnessLabel.append(brightnessText, brightness);
            const center = picker.width / 2;
            const radius = center - 3;
            const wheelImage = pickerContext.createImageData(picker.width, picker.height);
            for (let y = 0; y < picker.height; y++) {
                for (let x = 0; x < picker.width; x++) {
                    const dx = x - center + 0.5;
                    const dy = center - y - 0.5;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance > radius) continue;
                    const hue = (Math.atan2(dy, dx) / (Math.PI * 2) + 1) % 1;
                    const saturation = distance / radius;
                    const sector = hue * 6;
                    const chroma = saturation;
                    const secondary = chroma * (1 - Math.abs((sector % 2) - 1));
                    const rgb = sector < 1 ? [chroma, secondary, 0]
                        : sector < 2 ? [secondary, chroma, 0]
                            : sector < 3 ? [0, chroma, secondary]
                                : sector < 4 ? [0, secondary, chroma]
                                    : sector < 5 ? [secondary, 0, chroma]
                                        : [chroma, 0, secondary];
                    const offset = (y * picker.width + x) * 4;
                    wheelImage.data[offset] = Math.round((rgb[0] + 1 - chroma) * 255);
                    wheelImage.data[offset + 1] = Math.round((rgb[1] + 1 - chroma) * 255);
                    wheelImage.data[offset + 2] = Math.round((rgb[2] + 1 - chroma) * 255);
                    wheelImage.data[offset + 3] = 255;
                }
            }
            pickerContext.putImageData(wheelImage, 0, 0);

            let selectedHue = 0;
            let selectedSaturation = 0;
            const pickerRgbAtBrightness = value => {
                const sector = selectedHue * 6;
                const chroma = selectedSaturation;
                const secondary = chroma * (1 - Math.abs((sector % 2) - 1));
                const base = sector < 1 ? [chroma, secondary, 0]
                    : sector < 2 ? [secondary, chroma, 0]
                        : sector < 3 ? [0, chroma, secondary]
                            : sector < 4 ? [0, secondary, chroma]
                                : sector < 5 ? [secondary, 0, chroma]
                                    : [chroma, 0, secondary];
                return base.map(channel => Math.round((channel + 1 - chroma) * value * 255));
            };
            const updateBrightnessTrack = () => {
                const [r, g, b] = pickerRgbAtBrightness(1);
                brightness.style.setProperty('--brightness-color', `rgb(${r}, ${g}, ${b})`);

            const updatePreview = values => {

                const range = maxChannel - minChannel;
                brightness.value = String(THREE.MathUtils.clamp(maxChannel / 255, 0, 1));
                selectedSaturation = maxChannel > 0 ? range / maxChannel : 0;
                if (range > 0) {
                    if (maxChannel === values.r) selectedHue = ((values.g - values.b) / range / 6 + 1) % 1;
                    else if (maxChannel === values.g) selectedHue = ((values.b - values.r) / range + 2) / 6;
                    else selectedHue = ((values.r - values.g) / range + 4) / 6;

                const markerX = center + Math.cos(angle) * selectedSaturation * radius;

                const adjust = amount => {

                        Number(input.value || 0) + amount,
                        channelMin,
                        channelMax,
                    ));
                    input.dispatchEvent(new Event('input', { bubbles: true }));
                };
                const bindRepeatingButton = (button, amount) => {
                    let holdTimeout;
                    let repeatInterval;
                    let isRepeating = false;
                    let suppressNextClick = false;
                    let activePointerId;

                    const stopRepeating = () => {
                        window.clearTimeout(holdTimeout);
                        window.clearInterval(repeatInterval);
                        holdTimeout = undefined;
                        repeatInterval = undefined;
                    };

                    const handlePointerUp = event => {
                        if (event.pointerId !== activePointerId) return;
                        stopRepeating();
                        suppressNextClick = isRepeating;
                        isRepeating = false;
                        activePointerId = undefined;
                        if (suppressNextClick) {
                            window.setTimeout(() => {
                                suppressNextClick = false;
                            }, 0);
                        }
                        window.removeEventListener('pointerup', handlePointerUp);
                        window.removeEventListener('pointercancel', handlePointerCancel);
                    };
                    const handlePointerCancel = event => {
                        if (event.pointerId !== activePointerId) return;
                        stopRepeating();
                        isRepeating = false;
                        suppressNextClick = false;
                        activePointerId = undefined;
                        window.removeEventListener('pointerup', handlePointerUp);
                        window.removeEventListener('pointercancel', handlePointerCancel);
                    };

                    button.addEventListener('pointerdown', event => {
                        if (event.button !== 0 || activePointerId !== undefined) return;
                        stopRepeating();
                        isRepeating = false;
                        suppressNextClick = false;
                        activePointerId = event.pointerId;
                        window.addEventListener('pointerup', handlePointerUp);
                        window.addEventListener('pointercancel', handlePointerCancel);
                        holdTimeout = window.setTimeout(() => {
                            isRepeating = true;
                            adjust(amount);
                            repeatInterval = window.setInterval(() => adjust(amount), 75);
                        }, 350);
                    });
                    button.addEventListener('click', () => {
                        if (suppressNextClick) {
                            suppressNextClick = false;
                            return;
                        }
                        adjust(amount);
                    });
                };
                bindRepeatingButton(increment, 1);
                bindRepeatingButton(decrement, -1);
                buttons.append(increment, decrement);
                input.addEventListener('input', () => {
                    if (input.value === '') return;
                    const enteredValue = Number(input.value);
                    if (!Number.isFinite(enteredValue)) return;
                    const value = THREE.MathUtils.clamp(enteredValue, channelMin, channelMax);
                    if (value !== enteredValue) input.value = String(value);
                    const values = Object.fromEntries(
