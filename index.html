            const irisRadius = size * 0.3;
            context.save();
            context.beginPath();
            context.arc(center, center, irisRadius, 0, Math.PI * 2);
            context.clip();
            context.globalCompositeOperation = 'color';
            context.globalAlpha = 0.35;
            context.fillStyle = irisHex;
            context.fillRect(0, 0, size, size);
            context.restore();

            const texture = new THREE.CanvasTexture(canvas);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.flipY = false;
            if (currentEyeUvMap) copyTextureTransform(texture, currentEyeUvMap);
            return texture;
        }

        function refreshEyeTexture() {
            if (!currentEyeMaterial) return;
            const previousTexture = currentEyeMaterial.map;
            const eyeHex = currentSkinIsGlitched
                ? rgbaToNerfGlitchHex(eyeColorRgba)
                : rgbaToHex(eyeColorRgba);
            currentEyeMaterial.map = createEyeTexture(eyeHex);
            currentEyeMaterial.needsUpdate = true;
            if (previousTexture) previousTexture.dispose();
        }

        function createLinearTexture(image) {
            const texture = new THREE.Texture(image);
            texture.colorSpace = THREE.NoColorSpace;
            texture.flipY = false;
            texture.needsUpdate = true;
            return texture;
        }

        function createColorTexture(image) {
            const texture = new THREE.Texture(image);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.flipY = false;
            texture.needsUpdate = true;
            return texture;
        }

        function copyTextureTransform(target, source) {
            target.wrapS = source.wrapS;
            target.wrapT = source.wrapT;
            target.channel = source.channel;
            target.matrixAutoUpdate = source.matrixAutoUpdate;
            if (source.matrixAutoUpdate) {
                target.offset.copy(source.offset);
                target.repeat.copy(source.repeat);
                target.rotation = source.rotation;
                target.center.copy(source.center);
            } else {
                target.matrix.copy(source.matrix);
                target.needsUpdate = true;
            }
            if (source.matrixAutoUpdate) target.updateMatrix();
        }

        function createSkinMaterial(image, modelConfig = {}, mapImages = {}, sourceMaterial = null) {
            if (!mapImages.mask || !mapImages.albedo) {
                throw new Error(`The base mask and albedo maps are required for ${modelConfig.name || 'this model'}.`);
            }
            if (!sourceMaterial?.map) {
                throw new Error(`The embedded DinoBody texture is missing for ${modelConfig.name || 'this model'}.`);
            }
            const patternMask = createLinearTexture(image);
            const baseMask = createLinearTexture(mapImages.mask);
            const albedoMap = createColorTexture(mapImages.albedo);
            const skinNoise = mapImages.skinNoise ? createLinearTexture(mapImages.skinNoise) : null;
            [patternMask, baseMask, albedoMap, skinNoise].filter(Boolean).forEach(texture => {
                copyTextureTransform(texture, sourceMaterial.map);
            });
            currentSkinTextures = [patternMask, baseMask, albedoMap, skinNoise].filter(Boolean);
            currentZoneUniforms = zoneRgbaValues.map(color => ({ value: colorFromRgba(color) }));
            const skinUniforms = {
                uBaseMask: { value: baseMask },
                uPatternMask: { value: patternMask },
                uAlbedoMap: { value: albedoMap },
                uOrigMap: { value: sourceMaterial.map },
                uSkinNoise: { value: skinNoise || albedoMap },
                uHasSkinNoise: { value: Boolean(skinNoise) },
                uNoiseTiling: { value: skinNoise ? 8 : 0 },
                uTeethColor: { value: colorFromRgba(detailColors.teethColor) },
                uMouthColor: { value: colorFromRgba(detailColors.mouthColor) },
                uClawColor: { value: colorFromRgba(detailColors.clawColor) },
                uColorR: currentZoneUniforms[0],
                uColorG: currentZoneUniforms[1],
                uColorB: currentZoneUniforms[2],
                uColorC: currentZoneUniforms[3],
                uColorM: currentZoneUniforms[4],
                uColorY: currentZoneUniforms[5],
            };
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                roughness: Math.max(sourceMaterial?.roughness ?? 1, 1),
                metalness: 0,
                map: sourceMaterial.map,
                normalMap: sourceMaterial.normalMap || null,
                normalScale: new THREE.Vector2(1.3, 1.3),
                roughnessMap: sourceMaterial?.roughnessMap || null,
                alphaTest: modelConfig.alphaCutoff || sourceMaterial?.alphaTest || 0,
            });
            material.onBeforeCompile = shader => {
                if (!shader.fragmentShader.includes('#include <common>')
                    || !shader.fragmentShader.includes('#include <map_fragment>')
                    || !shader.fragmentShader.includes('#include <roughnessmap_fragment>')
                    || !shader.fragmentShader.includes('#include <lights_physical_fragment>')) {
                    throw new Error('Could not apply the Oasis skin-map shader to the model.');
                }
                Object.assign(shader.uniforms, skinUniforms);
                currentSkinSpecularUniform = { value: Number(skinSpecularInput.value) };
                shader.uniforms.skinSpecularStrength = currentSkinSpecularUniform;
                currentGenderUniform = { value: isFemale };
                shader.uniforms.isFemale = currentGenderUniform;
                currentDetailUniforms = Object.fromEntries(detailColorSettings.map(({ key }) => [
                    key,
                    { value: colorFromRgba(detailColors[key]) },
                ]));
                shader.uniforms.uTeethColor = currentDetailUniforms.teethColor;
                shader.uniforms.uMouthColor = currentDetailUniforms.mouthColor;
                shader.uniforms.uClawColor = currentDetailUniforms.clawColor;
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <common>',
                    `#include <common>
                    uniform sampler2D uBaseMask;
                    uniform sampler2D uPatternMask;
                    uniform sampler2D uAlbedoMap;
                    uniform sampler2D uOrigMap;
                    uniform sampler2D uSkinNoise;
                    uniform bool uHasSkinNoise;
                    uniform float uNoiseTiling;
                    uniform float skinSpecularStrength;
                    uniform bool isFemale;
                    uniform vec3 uTeethColor;
                    uniform vec3 uMouthColor;
                    uniform vec3 uClawColor;
                    uniform vec3 uColorR;
                    uniform vec3 uColorG;
                    uniform vec3 uColorB;
                    uniform vec3 uColorC;
                    uniform vec3 uColorM;
                    uniform vec3 uColorY;
                    float zoneSharpen(float weight) { return weight * weight; }
                    vec3 zoneLayer(vec3 base, float wR, float wG, float wB,
                        float wC, float wM, float wY, float coverage) {
                        float total = wR + wG + wB + wC + wM + wY;
                        if (total <= 0.0001 || coverage <= 0.001) return base;
                        float sR = zoneSharpen(wR), sG = zoneSharpen(wG), sB = zoneSharpen(wB);
                        float sC = zoneSharpen(wC), sM = zoneSharpen(wM), sY = zoneSharpen(wY);
                        float sum = sR + sG + sB + sC + sM + sY;
                        vec3 color = (sR * (isFemale ? uColorM : uColorR) + sG * uColorG
                            + sB * uColorB + sC * uColorC + sM * uColorM + sY * uColorY)
                            / max(sum, 1e-8);
                        return mix(base, color, coverage);
                    }
                    vec3 blendOverlay(vec3 base, vec3 layer) {
                        return mix(2.0 * base * layer,
                            1.0 - 2.0 * (1.0 - base) * (1.0 - layer), step(0.5, base));
                    }`,
                );
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <map_fragment>',
                    `
                    #ifdef USE_MAP
                        vec3 baseMask = texture2D(uBaseMask, vMapUv).rgb;
                        vec3 patternMask = texture2D(uPatternMask, vMapUv).rgb;
                        vec3 albedo = texture2D(uAlbedoMap, vMapUv).rgb;
                        float baseCoverage = smoothstep(0.03, 0.15,
                            max(max(baseMask.r, baseMask.g), baseMask.b));
                        float patternCoverage = smoothstep(0.03, 0.15,
                            max(max(patternMask.r, patternMask.g), patternMask.b));

                        float baseR = baseMask.r * (1.0 - baseMask.g) * (1.0 - baseMask.b);
                        float baseG = baseMask.g * (1.0 - baseMask.r) * (1.0 - baseMask.b);
                        float baseB = baseMask.b * (1.0 - baseMask.r) * (1.0 - baseMask.g);
                        float baseC = baseMask.g * baseMask.b * (1.0 - baseMask.r);
                        float baseM = baseMask.r * baseMask.b * (1.0 - baseMask.g);
                        float baseY = baseMask.r * baseMask.g * (1.0 - baseMask.b);
                        float patternR = patternMask.r * (1.0 - patternMask.g) * (1.0 - patternMask.b);
                        float patternG = patternMask.g * (1.0 - patternMask.r) * (1.0 - patternMask.b);
                        float patternB = patternMask.b * (1.0 - patternMask.r) * (1.0 - patternMask.g);
                        float patternC = patternMask.g * patternMask.b * (1.0 - patternMask.r);
                        float patternM = patternMask.r * patternMask.b * (1.0 - patternMask.g);
                        float patternY = patternMask.r * patternMask.g * (1.0 - patternMask.b);

                        vec3 skinColor = vec3(0.0);
                        skinColor = zoneLayer(skinColor, 0.0, 0.0, 0.0,
                            baseC, baseM, baseY, baseCoverage);
                        skinColor = zoneLayer(skinColor, patternR, patternG, patternB,
                            patternC, patternM, patternY, patternCoverage);
                        skinColor = mix(skinColor, uTeethColor, baseR);
                        skinColor = mix(skinColor, uMouthColor, baseG);
                        skinColor = mix(skinColor, uClawColor, baseB);

                        if (uHasSkinNoise && uNoiseTiling > 0.001) {
                            float noise = texture2D(uSkinNoise, vMapUv * uNoiseTiling).g;
                            skinColor *= 1.0 + (noise - 0.607) * 1.6;
                        }
                        vec3 cavity = texture2D(uOrigMap, vMapUv).rgb;
                        diffuseColor.rgb = blendOverlay(clamp(skinColor, 0.0, 1.0) * albedo, cavity);
                        diffuseColor.a = texture2D(uOrigMap, vMapUv).a;
                    #endif
                    `,
                );
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <roughnessmap_fragment>',
                    `#include <roughnessmap_fragment>
                    roughnessFactor = mix(roughnessFactor, 1.0, 0.35);
                    if (uHasSkinNoise && uNoiseTiling > 0.001) {
                        float noise = texture2D(uSkinNoise, vMapUv * uNoiseTiling).g;
                        roughnessFactor = clamp(roughnessFactor - (noise - 0.607) * 0.25, 0.0, 1.0);
                    }`,
                );
                shader.fragmentShader = shader.fragmentShader.replace(
                    '#include <lights_physical_fragment>',
                    `#include <lights_physical_fragment>
                    material.specularColor *= skinSpecularStrength;
                    material.specularF90 *= skinSpecularStrength;`,
                );
            };
            material.userData.skinUniforms = skinUniforms;
            material.customProgramCacheKey = () => 'oasis-skin-mask-material-v1';
            return material;
        }

        function captureImportedMaterials(model) {
            const materials = new Set();
            model.traverse(child => {
                if (!child.isMesh) return;
                const meshMaterials = Array.isArray(child.material) ? child.material : [child.material];
                meshMaterials.forEach(material => {
                    if (material) materials.add(material);
                });
            });
            currentImportedMaterials = [...materials];
        }

        function disposeCurrentModel() {
            if (!currentModel) return;
            scene.remove(currentModel);

            const importedTextures = new Set();
            currentImportedMaterials.forEach(material => {
                Object.values(material).forEach(value => {
                    if (value?.isTexture) importedTextures.add(value);
                });
                material.dispose();
            });
            importedTextures.forEach(texture => texture.dispose());

            const materials = new Set();
            currentModel.traverse(child => {
                if (!child.isMesh) return;
                const meshMaterials = Array.isArray(child.material) ? child.material : [child.material];
                meshMaterials.forEach(material => {
                    if (material && material !== currentSkinMaterial) {
                        material.map?.dispose();
                        materials.add(material);
                    }
                });
            });
            materials.forEach(material => material.dispose());

            if (currentSkinMaterial) currentSkinMaterial.dispose();
            currentSkinTextures.forEach(texture => texture.dispose());
            currentModel = null;
            currentImportedMaterials = [];
            currentSkinMaterial = null;
            currentEyeMaterial = null;
            currentEyeImage = null;
            currentEyeUvMap = null;
            currentSkinTextures = [];
            currentZoneUniforms = [];
            currentDetailUniforms = {};
            currentGenderUniform = null;
            currentSkinSpecularUniform = null;
            growthMeshes = [];
        }

        function frameModel(model) {
            const bounds = new THREE.Box3().setFromObject(model);
            const sphere = bounds.getBoundingSphere(new THREE.Sphere());
            const modelSize = bounds.getSize(new THREE.Vector3());
            const radius = Math.max(sphere.radius, 0.1);
            keyLightDistance = radius * 4;
            const groundSize = Math.max(modelSize.x, modelSize.z, radius) * 30;
            groundPlane.geometry.dispose();
            groundPlane.geometry = new THREE.PlaneGeometry(groundSize, groundSize);
            groundPlane.position.set(sphere.center.x, 0, sphere.center.z);

            const shadowCamera = directionalLight.shadow.camera;
            const shadowExtent = radius * 2;
            shadowCamera.left = -shadowExtent;
            shadowCamera.right = shadowExtent;
            shadowCamera.top = shadowExtent;
            shadowCamera.bottom = -shadowExtent;
            shadowCamera.near = Math.max(radius * 0.01, 0.1);
            shadowCamera.far = radius * 8;
            shadowCamera.updateProjectionMatrix();
            directionalLight.shadow.needsUpdate = true;

            const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 0.84;
            const viewDirection = new THREE.Vector3(1, 0.3, 0.4).normalize();
            const viewRight = new THREE.Vector3(viewDirection.z, 0, -viewDirection.x).normalize();

            controls.target.copy(sphere.center).addScaledVector(viewRight, -radius * 0.45);
            camera.position.copy(controls.target).addScaledVector(viewDirection, distance);
            camera.near = Math.max(radius / 100, 0.01);
            camera.far = radius * 100;
            camera.updateProjectionMatrix();
            controls.minDistance = radius * 1.05;
            controls.maxDistance = radius * 12;
            controls.update();
        }

        function loadGltf(path) {
            return new Promise((resolve, reject) => {
                loader.load(path, resolve, undefined, reject);
            });
        }

        function loadImage(url) {
            return new Promise((resolve, reject) => {
                const image = new Image();
                image.onload = () => resolve(image);
                image.onerror = () => reject(new Error(`Could not load texture: ${url}`));
                image.src = url;
            });
        }

        function populatePatternSelector(choices) {
            currentPatternChoices = choices;
            patternSelect.replaceChildren();
            if (!choices.length) {
                patternSelect.add(new Option('No skin patterns available', ''));
                patternSelect.disabled = true;
                return;
            }

            choices.forEach((choice, index) => {
                const label = choice.label.replace(/^Adult\s+(\d+)$/i, '$1');
                patternSelect.add(new Option(label, String(index)));
            });
            patternSelect.value = '0';
            patternSelect.disabled = false;
        }

        async function applyPatternChoice(index) {
            const choice = currentPatternChoices[index];
            if (!choice || !currentSkinMaterial) return;

            const request = modelLoadRequest;
            const imageUrl = downloadedAssetUrl(choice.file);
            try {
                const image = await loadImage(imageUrl);
                if (request !== modelLoadRequest || !currentSkinMaterial) return;
                const patternUniform = currentSkinMaterial.userData.skinUniforms?.uPatternMask;
                if (!patternUniform) throw new Error('The model skin-pattern shader is not initialized.');
                const previousTexture = patternUniform.value;
                const nextTexture = createLinearTexture(image);
                copyTextureTransform(nextTexture, currentSkinMaterial.map);
                patternUniform.value = nextTexture;
                currentSkinTextures = currentSkinTextures.filter(texture => texture !== previousTexture);
                currentSkinTextures.push(nextTexture);
                previousTexture?.dispose();
            } catch (error) {
                if (request !== modelLoadRequest) return;
                console.error(`Could not load skin pattern "${choice.label}".`, error);
            }
        }

        patternSelect.addEventListener('change', () => {
            applyPatternChoice(Number(patternSelect.value));
        });

        function downloadedAssetUrl(assetPath) {
            if (!downloadedAssetsBase) {
                throw new Error('The downloaded test bundle is available only through the Vite development server.');
            }
            return `${downloadedAssetsBase}/${assetPath.replace(/^\/+/, '')}`;
        }

        async function getDownloadedManifest() {
            if (downloadedManifest) return downloadedManifest;
            if (!downloadedManifestPromise) {
                downloadedManifestPromise = fetch(downloadedAssetUrl('asset-manifest.json'))
                    .then(response => {
                        if (!response.ok) throw new Error(`Could not load the downloaded asset manifest (HTTP ${response.status}).`);
                        return response.json();
                    })
                    .then(manifest => {
                        downloadedManifest = manifest;
                        return manifest;
                    })
                    .catch(error => {
                        downloadedManifestPromise = null;
                        throw error;
                    });
            }
            return downloadedManifestPromise;
        }

        async function loadDownloadedMaterialMaps(modelData) {
            const modelMaps = modelData.maps || {};
            const mapFiles = [
                ['mask', modelMaps.mask || modelData.maskMap],
                ['albedo', modelMaps.albedo],
                ['skinNoise', modelMaps.skinNoise],
            ].filter(([, path]) => path);
            if (!mapFiles.some(([name]) => name === 'mask') || !mapFiles.some(([name]) => name === 'albedo')) {
                throw new Error(`The base mask or albedo map is missing from ${modelData.name}'s metadata.`);
            }
            const resolveMapUrl = path => {
                const speciesPrefix = `/files/${modelData.name}/`;
                const assetPath = path.startsWith(speciesPrefix)
                    ? path
                    : `files/${modelData.name}/${path.replace(/^\/+/, '')}`;
                return downloadedAssetUrl(assetPath);
            };
            const loadedMaps = await Promise.all(mapFiles.map(async ([name, path]) => {
                try {
                    return [name, await loadImage(resolveMapUrl(path))];
                } catch (error) {
                    throw new Error(`Could not load ${name} map for ${modelData.name}.`, { cause: error });
                }
            }));
            return Object.fromEntries(loadedMaps);
        }

        function updateZoneDefaults(defaults) {
            if (!Array.isArray(defaults) || defaults.length !== zoneColors.length) return;
            zoneColors = defaults.slice();
            zoneRgbaValues = defaults.map(rgbaValuesFromHex);
            zoneRgbaValues.forEach((values, index) => {
                rgbaColorControls.get(`zone-${index}`)?.(values);
                currentZoneUniforms[index]?.value.copy(colorFromRgba(values));
            });
            refreshEyeTexture();
        }

        function updateDetailColorDefaults(config = {}) {
            detailColorSettings.forEach(({ key, defaultColor }) => {
                detailColors[key] = rgbaValuesFromHex(config[key] || defaultColor);
                rgbaColorControls.get(key)?.(detailColors[key]);
                currentDetailUniforms[key]?.value.copy(colorFromRgba(detailColors[key]));
            });
        }

        function updateEyeColorDefault(config = {}) {
            eyeColorRgba = rgbaValuesFromHex(config.eyeColorHex || '#FFBE00');
            rgbaColorControls.get('eye')?.(eyeColorRgba);
            refreshEyeTexture();
        }

        async function loadDownloadedAnimations(model, root, request) {
            const boneNames = new Set();
            root.traverse(node => {
                if (node.name) boneNames.add(node.name);
            });

            const animationResults = await Promise.allSettled(model.animationFiles.map(async filename => {
                const animationUrl = downloadedAssetUrl(`files/${model.name}/Animations/${filename}`);
                const response = await fetch(animationUrl);
                if (!response.ok) throw new Error(`${filename}: HTTP ${response.status}`);
                const parsed = parseUEAnim(await response.arrayBuffer());
                const compatibleTracks = parsed.tracks.filter(track => boneNames.has(track.boneName));
                const clip = buildUEAnimationClip({ ...parsed, tracks: compatibleTracks }, THREE, boneNames);
                clip.name = filename.replace(/\.ueanim$/i, '');
                if (!clip.tracks.length) throw new Error(`${filename}: no animation tracks match this model's skeleton.`);
                return isOneShotAnimation(clip) ? clip : makeLoopSeamContinuous(clip);
            }));

            if (request !== modelLoadRequest) return [];
            const clips = [];
            const failures = [];
            animationResults.forEach((result, index) => {
                if (result.status === 'fulfilled') clips.push(result.value);
                else failures.push(`${model.animationFiles[index]}: ${result.reason.message}`);
            });
            if (failures.length) console.warn(`${model.name}: ${failures.length} UEAnim file(s) could not be used.`, failures);
            return clips;
        }

        async function loadDownloadedSpeciesModel(speciesName, request) {
            try {
                const manifest = await getDownloadedManifest();
                if (request !== modelLoadRequest) return;
                const modelData = manifest.models.find(model => model.name === speciesName);
                if (!modelData?.modelGlbUrl) throw new Error(`No downloaded GLB is listed for ${speciesName}.`);

                const modelPath = modelData.modelGlbUrl.replace(/^\/files\//, '');
                const gltf = await loadGltf(downloadedAssetUrl(`files/${modelPath}`));
                if (request !== modelLoadRequest) return;

                populatePatternSelector((modelData.skins || []).map(skin => ({
                    label: skin.name,
                    file: skin.url,
                })));
                const firstSkin = modelData.skins?.[0];
                if (!firstSkin?.url) throw new Error(`No downloaded skin texture is listed for ${speciesName}.`);
                const patternImage = await loadImage(downloadedAssetUrl(firstSkin.url));
                if (request !== modelLoadRequest) return;

                const eyeTexturePath = modelData.eye?.composedTexture || modelData.eye?.scleraTexture
                    ? `/files/${modelData.name}/${modelData.eye.composedTexture || modelData.eye.scleraTexture}`
                    : '/files/Eye/T_Eye_Sclera_D.png';
                const [mapImages, eyeImage] = await Promise.all([
                    loadDownloadedMaterialMaps(modelData),
                    loadImage(downloadedAssetUrl(eyeTexturePath)),
                ]);
                if (request !== modelLoadRequest) return;

                const animationClips = modelData.animationFiles?.length
                    ? await loadDownloadedAnimations(modelData, gltf.scene, request)
                    : gltf.animations || [];
                if (request !== modelLoadRequest) return;

                if (currentMixer) {
                    currentMixer.stopAllAction();
                    currentMixer = null;
                }
                animationToggleButton.disabled = true;
                currentAction = null;
                idleClip = null;
                disposeCurrentModel();

                if (!hasLoadedSpeciesModel) {
                    updateZoneDefaults(modelData.zoneDefaults);
                    updateDetailColorDefaults(modelData);
                    updateEyeColorDefault(modelData);
                }
                currentEyeImage = eyeImage;
                currentModel = gltf.scene;
                captureImportedMaterials(currentModel);
                const sourceSkinMaterial = modelData.embeddedMaterialMaps
                    ? currentImportedMaterials.find(material => material.name === 'DinoBody')
                    : null;
                if (modelData.embeddedMaterialMaps && !sourceSkinMaterial) {
                    throw new Error(`The embedded skin material was not found for ${speciesName}.`);
                }
                currentSkinMaterial = createSkinMaterial(patternImage, modelData, mapImages, sourceSkinMaterial);
                const sourceEyeMaterial = currentImportedMaterials.find(material =>
                    material.name?.toLowerCase().includes('eye'));
                currentEyeUvMap = sourceEyeMaterial?.map || null;
                currentEyeMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.25,
                    map: createEyeTexture(rgbaToHex(eyeColorRgba)),
                    side: THREE.DoubleSide,
                });
                growthMeshes = [];
                currentModel.traverse(child => {
                    if (!child.isMesh) return;
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.morphTargetDictionary && child.morphTargetInfluences) growthMeshes.push(child);
                    const sourceMaterials = Array.isArray(child.material) ? child.material : [child.material];
                    const isEye = sourceMaterials.some(material => material?.name?.toLowerCase().includes('eye'))
                        || child.geometry.attributes.position?.count < 500;
                    child.material = isEye ? currentEyeMaterial : currentSkinMaterial;
                });
                const availableGrowthStages = new Set(
                    growthMeshes.flatMap(mesh => Object.keys(mesh.morphTargetDictionary)),
                );
                currentGrowthStages = growthStageOrder.filter(stage =>
                    stage === 'Adult' || availableGrowthStages.has(stage));
                setGrowth(adultGrowthValue());
                scene.add(currentModel);
                frameModel(currentModel);

                idleClip = animationClips.find(clip => /(?:^|_)Adult_Idle$/i.test(clip.name))
                    || animationClips.find(clip => /idle/i.test(clip.name) && !/crouch|swim|sit/i.test(clip.name));
                currentModel.animations = animationClips;
                populateAnimationSelector(animationClips);
                viewerMessage.hidden = true;
                hasLoadedSpeciesModel = true;

                if (animationClips.length) {
                    currentMixer = new THREE.AnimationMixer(currentModel);
                    isAnimationPaused = false;
                    currentMixer.timeScale = 1;
                    animationToggleButton.disabled = false;
                    updateAnimationToggle();
                    playAnimation(idleClip || animationClips[0]);
                    currentMixer.addEventListener('finished', event => {
                        if (event.action !== currentAction || !idleClip || event.action.getClip() === idleClip) return;
                        playAnimation(idleClip);
                    });
                    console.log(`${speciesName}: loaded downloaded GLB and ${animationClips.length} UEAnim clip(s).`);
                } else {
                    isAnimationPaused = false;
                    updateAnimationToggle();
                    console.warn(`${speciesName}: the downloaded model loaded, but no compatible UEAnim clips were found.`);
                    populateAnimationSelector([]);
                }
                return true;
            } catch (error) {
                if (request !== modelLoadRequest) return;
                viewerMessage.hidden = false;
                viewerMessage.textContent = `Could not load downloaded test assets for ${speciesName}.\n${error.message}`;
                console.error(`Could not load downloaded assets for ${speciesName}.`, error);
                return false;
            }
        }

        async function loadSpeciesModel(speciesName) {
            const request = ++modelLoadRequest;
            viewerMessage.hidden = false;
            viewerMessage.textContent = `Loading ${speciesName}…`;
            return await loadDownloadedSpeciesModel(speciesName, request);
        }

        const speciesSelect = document.getElementById('speciesSelect');
        speciesList.forEach(sp => {
            const opt = document.createElement('option');
            opt.value = sp;
            opt.textContent = sp;
            speciesSelect.appendChild(opt);
        });

        speciesSelect.addEventListener('change', (e) => {
            loadSpeciesModel(e.target.value);
        });

        const presetStorageKey = 'sushy-skin-editor-presets-v1';
        const presetNameInput = document.getElementById('presetName');
        const savedPresetSelect = document.getElementById('savedPresetSelect');
        const skinCodeFormatSelect = document.getElementById('skinCodeFormat');
        const base64PatternNumberingSelect = document.getElementById('base64PatternNumbering');
        const skinCodeOutput = document.getElementById('skinCodeOutput');
        const skinCodeInput = document.getElementById('skinCodeInput');
        const presetStatus = document.getElementById('presetStatus');
        const copySkinCodeButton = document.getElementById('copySkinCodeButton');
        const loadSkinCodeButton = document.getElementById('loadSkinCodeButton');
        const skinCodeActionFeedbackTimeouts = new WeakMap();

        function setPresetStatus(message, isError = false) {
            presetStatus.textContent = message;
            presetStatus.style.color = isError ? '#ff8b8b' : `rgb(${activeTheme.colors.text})`;
        }

        function resetSkinCodeActionFeedback(button, label) {
            const timeout = skinCodeActionFeedbackTimeouts.get(button);
            if (timeout !== undefined) window.clearTimeout(timeout);
            skinCodeActionFeedbackTimeouts.delete(button);
            button.textContent = label;
        }

        function showSkinCodeActionSuccess(button, label, message) {
            resetSkinCodeActionFeedback(button, label);
            button.textContent = `✓ ${label}`;
            setPresetStatus(message);
            skinCodeActionFeedbackTimeouts.set(button, window.setTimeout(() => {
                button.textContent = label;
                skinCodeActionFeedbackTimeouts.delete(button);
            }, 2000));
        }

        function getSavedPresets() {
            const serialized = localStorage.getItem(presetStorageKey);
            if (!serialized) return [];
            const presets = JSON.parse(serialized);
            if (!Array.isArray(presets)) throw new Error('Saved preset storage has an invalid format.');
            return presets;
        }

        function refreshSavedPresetList(selectedId = '') {
            const presets = getSavedPresets();
            savedPresetSelect.replaceChildren();
            if (!presets.length) {
                savedPresetSelect.add(new Option('No saved presets', ''));
                return;
            }
            presets.forEach(preset => {
                savedPresetSelect.add(new Option(preset.name, preset.id));
            });
            if (selectedId && presets.some(preset => preset.id === selectedId)) {
                savedPresetSelect.value = selectedId;
            }
        }

        function getCurrentSkinPreset(name = '') {
            const selectedPattern = currentPatternChoices[Number(patternSelect.value)];
            return {
                version: 1,
                name,
                species: speciesSelect.value,
                gender: isFemale ? 'female' : 'male',
                patternFile: selectedPattern?.file || '',
                growth: growthValue,
                zones: zoneRgbaValues.map(values => ({ ...values })),
                eye: { ...eyeColorRgba },
                details: Object.fromEntries(detailColorSettings.map(({ key }) => [
                    key,
                    { ...detailColors[key] },
                ])),
                glitchSkin: currentSkinIsGlitched || hasNonByteRgbValues([
                    ...zoneRgbaValues,
                    eyeColorRgba,
                    ...Object.values(detailColors),
                ]),
            };
        }

        function validateRgbaColor(value, label) {
            if (!value || typeof value !== 'object') throw new Error(`${label} color is missing.`);
            for (const channel of ['r', 'g', 'b']) {
                if (typeof value[channel] !== 'number' || !Number.isFinite(value[channel])
                    || value[channel] < -glitchRgbLimit || value[channel] > glitchRgbLimit) {
                    throw new Error(`${label} ${channel.toUpperCase()} must be a number from -${glitchRgbLimit} to ${glitchRgbLimit}.`);
                }
            }
            return { r: value.r, g: value.g, b: value.b };
        }

        function validateSkinPreset(preset) {
            if (!preset || preset.version !== 1) throw new Error('Unsupported skin code version.');
            if (!speciesList.includes(preset.species)) throw new Error('Skin code has an unknown species.');
            if (!['male', 'female'].includes(preset.gender)) throw new Error('Skin code has an invalid gender.');
            if (!Array.isArray(preset.zones) || preset.zones.length !== 6) {
                throw new Error('Skin code must contain all six skin-zone colors.');
            }
            const zones = preset.zones.map((color, index) => validateRgbaColor(color, `Zone ${index + 1}`));
            const details = Object.fromEntries(detailColorSettings.map(({ key, label }) => [
                key,
                validateRgbaColor(preset.details?.[key], label),
            ]));
            if (preset.growth !== undefined && preset.growth !== null
                && (typeof preset.growth !== 'number' || !Number.isFinite(preset.growth)
                    || preset.growth < 0 || preset.growth > 1)) {
                throw new Error('Growth must be a number from 0 to 1.');
            }
            const patternFile = typeof preset.patternFile === 'string' ? preset.patternFile : '';
            const name = typeof preset.name === 'string' ? preset.name.slice(0, 60) : '';
            return {
                version: 1,
                name,
                species: preset.species,
                gender: preset.gender,
                patternFile,
                growth: preset.growth ?? null,
                zones,
                eye: validateRgbaColor(preset.eye, 'Eye'),
                details,
                glitchSkin: preset.glitchSkin === true || hasNonByteRgbValues([
                    ...zones,
                    preset.eye,
                    ...Object.values(details),
                ]),
            };
        }

        function encodeSkinCode(preset) {
            const bytes = new TextEncoder().encode(JSON.stringify(preset));
            const hexPayload = Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
            return `SKINHEX1:${hexPayload}`;
        }

        function encodeExtendedRgbCode(preset) {
            return `RGBX1:${JSON.stringify(preset)}`;
        }

        function encodeBase64SkinCode(preset, zeroBasedPattern = false) {
            const glitchSkin = zeroBasedPattern && preset.glitchSkin;
            const toHex = glitchSkin ? rgbaToNerfGlitchHex : rgbaToHex;
            const data = {
                colors: {
                    maleDisplayColor: toHex(preset.zones[0]),
                    underbellyColor: toHex(preset.zones[1]),
                    flankColor: toHex(preset.zones[2]),
                    bodyColor: toHex(preset.zones[3]),
                    markingsColor: toHex(preset.zones[4]),
                    detail1Color: toHex(preset.zones[5]),
                    eyesColor: toHex(preset.eye),
                    teethColor: toHex(preset.details.teethColor),
                    mouthColor: toHex(preset.details.mouthColor),
                    clawColor: toHex(preset.details.clawColor),
                },
                patternVariation: String(currentSkinMaterial?.userData.skinUniforms?.uNoiseTiling?.value ?? 0),
                pattern: String(Number(patternSelect.value) + (zeroBasedPattern ? 0 : 1)),
                gender: preset.gender,
                model: preset.species,
                sunAzimuth: String(THREE.MathUtils.radToDeg(sunAzimuthOffset)),
                sunIntensity: sunIntensityInput.value,
            };
            if (glitchSkin) {
                data.glitchSkin = true;
                data.glitchColors = {
                    maleDisplayColor: preset.zones[0],
                    markingsColor: preset.zones[4],
                    bodyColor: preset.zones[3],
                    flankColor: preset.zones[2],
                    underbellyColor: preset.zones[1],
                    detail1Color: preset.zones[5],
                    eyesColor: preset.eye,
                    teethColor: preset.details.teethColor,
                    mouthColor: preset.details.mouthColor,
                    clawColor: preset.details.clawColor,
                };
            }
            const bytes = new TextEncoder().encode(JSON.stringify(data));
            let binary = '';
            for (let index = 0; index < bytes.length; index += 0x8000) {
                binary += String.fromCharCode(...bytes.subarray(index, index + 0x8000));
            }
            return btoa(binary);
        }

        function rgbaToNerfGlitchHex(values) {
            const channel = value => {
                const byte = ((Math.round(value * 255) % 256) + 256) % 256;
                return byte.toString(16).padStart(2, '0');
            };
            return `#${channel(values.r)}${channel(values.g)}${channel(values.b)}`;
        }

        function encodeColorHexList(preset) {
            const visibleZoneIndices = [0, 4, 2, 3, 1];
            const colors = visibleZoneIndices.map(index => rgbaToHex(preset.zones[index]));
            colors.push(rgbaToHex(preset.eye));
            detailColorSettings.forEach(({ key }) => colors.push(rgbaToHex(preset.details[key])));
            return colors.join(' ');
        }

        function encodeSkinCodeForFormat(preset, format) {
            if (format === 'skinhex1') return encodeSkinCode(preset);
            if (format === 'extended-rgb') return encodeExtendedRgbCode(preset);
            if (format === 'oasis-base64') return encodeBase64SkinCode(preset);
            if (format === 'nerf-base64') return encodeBase64SkinCode(preset, true);
            if (format === 'color-hex') return encodeColorHexList(preset);
            throw new Error('Choose a supported skin-code export format.');
        }

        function hasExtendedRgbValues(preset) {
            return [
                ...preset.zones,
                preset.eye,
                ...Object.values(preset.details),
            ].some(color => hasNonByteRgbValues([color]));
        }

        function decodeExtendedRgbCode(code) {
            const payload = code.slice('RGBX1:'.length);
            if (!payload || payload.length > 30000) throw new Error('Invalid extended RGB skin code.');
            try {
                return validateSkinPreset(JSON.parse(payload));
            } catch (error) {
                if (error instanceof SyntaxError) throw new Error('Invalid extended RGB skin code.');
                throw error;
            }
        }

        function decodeSkinCode(code) {
            const normalizedCode = code.trim();
            const match = /^SKINHEX1:([0-9a-f]+)$/i.exec(normalizedCode);
            if (!match || match[1].length % 2 !== 0 || match[1].length > 30000) {
                throw new Error('Invalid skin code. Expected a SKINHEX1 code.');
            }
            const bytes = new Uint8Array(match[1].length / 2);
            for (let index = 0; index < bytes.length; index++) {
                bytes[index] = Number.parseInt(match[1].slice(index * 2, index * 2 + 2), 16);
            }
            return validateSkinPreset(JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)));
        }

        function decodeBase64SkinCode(code, patternNumbering) {
            const normalizedCode = code.trim();
            if (!normalizedCode || normalizedCode.length > 30000
                || !/^[A-Za-z0-9+/_-]+={0,2}$/.test(normalizedCode)
                || normalizedCode.length % 4 === 1) {
                throw new Error('Invalid Base64 skin code.');
            }
            const base64 = normalizedCode.replace(/-/g, '+').replace(/_/g, '/');
            let data;
            try {
                const binary = atob(base64.padEnd(Math.ceil(base64.length / 4) * 4, '='));
                const bytes = Uint8Array.from(binary, character => character.charCodeAt(0));
                data = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
            } catch (error) {
                if (error instanceof SyntaxError || error instanceof TypeError
                    || error?.name === 'InvalidCharacterError') {
                    throw new Error('Invalid Base64 skin code.');
                }
                throw error;
            }
            if (!data || typeof data !== 'object' || Array.isArray(data) || !data.colors) {
                throw new Error('Base64 skin code does not contain a colors object.');
            }
            const colors = data.colors;
            const colorFields = [
                ['maleDisplayColor', 'Male Display'],
                ['underbellyColor', 'Underbelly'],
                ['flankColor', 'Flank'],
                ['bodyColor', 'Body'],
                ['markingsColor', 'Markings'],
                ['detail1Color', 'Details'],
            ];
            const zones = Array(6);
            colorFields.forEach(([field, label], index) => {
                zones[index] = parseColorHexCode(colors[field]);
            });
            const details = Object.fromEntries(detailColorSettings.map(({ key, label }) => {
                const field = key === 'teethColor' ? 'teethColor'
                    : key === 'mouthColor' ? 'mouthColor' : 'clawColor';
                return [key, parseColorHexCode(colors[field])];
            }));
            let eye = parseColorHexCode(colors.eyesColor);
            const glitchSkin = data.glitchSkin === true;
            if (glitchSkin) {
                if (!data.glitchColors || typeof data.glitchColors !== 'object'
                    || Array.isArray(data.glitchColors)) {
                    throw new Error('NERF glitch skin code does not contain its glitchColors.');
                }
                const parseGlitchColor = (field, label) => {
                    const value = data.glitchColors[field];
                    if (!value || typeof value !== 'object' || Array.isArray(value)) {
                        throw new Error(`NERF glitch color "${field}" is missing.`);
                    }
                    const result = {};
                    for (const channel of ['r', 'g', 'b']) {
                        const raw = value[channel];
                        const number = typeof raw === 'number' ? raw
                            : typeof raw === 'string' && raw.trim() ? Number(raw) : NaN;
                        if (!Number.isFinite(number) || number < -glitchRgbLimit || number > glitchRgbLimit) {
                            throw new Error(`${label} ${channel.toUpperCase()} must be a number from -${glitchRgbLimit} to ${glitchRgbLimit}.`);
                        }
                        result[channel] = number;
                    }
                    return result;
                };
                const glitchColorMappings = [
                    ['maleDisplayColor', color => { zones[0] = color; }],
                    ['underbellyColor', color => { zones[1] = color; }],
                    ['flankColor', color => { zones[2] = color; }],
                    ['bodyColor', color => { zones[3] = color; }],
                    ['markingsColor', color => { zones[4] = color; }],
                    ['detail1Color', color => { zones[5] = color; }],
                    ['eyesColor', color => { eye = color; }],
                    ['teethColor', color => { details.teethColor = color; }],
                    ['mouthColor', color => { details.mouthColor = color; }],
                    ['clawColor', color => { details.clawColor = color; }],
                ];
                glitchColorMappings.forEach(([field, assign]) => {
                    assign(parseGlitchColor(field, field));
                });
            }
            const numberField = (value, label, min, max) => {
                const number = Number(value);
                if (!Number.isFinite(number) || number < min || number > max) {
                    throw new Error(`${label} must be a number from ${min} to ${max}.`);
                }
                return number;
            };
            const species = data.model;
            if (!speciesList.includes(species)) throw new Error('Base64 skin code has an unknown model.');
            if (!['male', 'female'].includes(data.gender)) {
                throw new Error('Base64 skin code has an invalid gender.');
            }
            const pattern = Number(data.pattern);
            const zeroBased = patternNumbering === 'zero-based'
                || (patternNumbering === 'auto'
                    && (pattern === 0 || data.glitchSkin === true));
            if (!Number.isInteger(pattern) || pattern < (zeroBased ? 0 : 1)) {
                throw new Error('Base64 skin code has an invalid pattern number.');
            }
            return {
                preset: validateSkinPreset({
                    version: 1,
                    name: '',
                    species,
                    gender: data.gender,
                    patternFile: '',
                    zones,
                    eye,
                    details,
                    glitchSkin,
                }),
                patternIndex: zeroBased ? pattern : pattern - 1,
                patternVariation: data.patternVariation === undefined
                    ? null
                    : numberField(data.patternVariation, 'Pattern variation', 0, 16),
                sunIntensity: data.sunIntensity === undefined
                    ? null
                    : numberField(data.sunIntensity, 'Key light intensity', 0, 3),
                sunAzimuth: data.sunAzimuth === undefined
                    ? null
                    : numberField(data.sunAzimuth, 'Sun azimuth', -360, 360),
            };
        }

        function decodeGameSkinJson(code, selectedSpecies) {
            let data;
            try {
                data = JSON.parse(code);
            } catch {
                throw new Error('Invalid skin JSON.');
            }
            if (!data || typeof data !== 'object' || Array.isArray(data)) {
                throw new Error('Skin JSON must be an object.');
            }

            const species = data.model || data.species || selectedSpecies;
            if (!speciesList.includes(species)) {
                throw new Error('Choose a supported species before loading JSON without a species field.');
            }
            if (typeof data.bIsFemale !== 'boolean') {
                throw new Error('Skin JSON must contain a boolean bIsFemale field.');
            }
            const patternIndex = Number(data.PatternIndex);
            if (!Number.isInteger(patternIndex) || patternIndex < 0) {
                throw new Error('Skin JSON PatternIndex must be a non-negative integer.');
            }
            const patternVariation = Number(data.SkinVariation);
            if (!Number.isFinite(patternVariation) || patternVariation < 0 || patternVariation > 16) {
                throw new Error('Skin JSON SkinVariation must be a number from 0 to 16.');
            }

            const clampedChannels = [];
            const readColor = field => {
                const color = data[field];
                if (!color || typeof color !== 'object' || Array.isArray(color)) {
                    throw new Error(`Skin JSON ${field} color is missing.`);
                }
                return Object.fromEntries(['R', 'G', 'B'].map(channel => {
                    const raw = color[channel];
                    const value = typeof raw === 'number' ? raw
                        : typeof raw === 'string' && raw.trim() ? Number(raw) : NaN;
                    if (!Number.isFinite(value)) {
                        throw new Error(`Skin JSON ${field}.${channel} must be a finite number.`);
                    }
                    const clampedValue = THREE.MathUtils.clamp(value, -glitchRgbLimit, glitchRgbLimit);
                    if (clampedValue !== value) clampedChannels.push(`${field}.${channel}`);
                    return [channel.toLowerCase(), clampedValue];
                }));
            };
            const details = {
                teethColor: readColor('TeethColor'),
                mouthColor: readColor('MouthColor'),
                clawColor: readColor('ClawsColor'),
            };

            return {
                preset: validateSkinPreset({
                    version: 1,
                    name: '',
                    species,
                    gender: data.bIsFemale ? 'female' : 'male',
                    patternFile: '',
                    zones: [
                        readColor('MaleDisplayColor'),
                        readColor('UnderbellyColor'),
                        readColor('FlankColor'),
                        readColor('BodyColor'),
                        readColor('MarkingsColor'),
                        readColor('Detail1Color'),
                    ],
                    eye: readColor('EyesColor'),
                    details,
                    glitchSkin: true,
                }),
                patternIndex,
                patternVariation,
                clampedChannels,
            };
        }

        function parseColorHexCode(code) {
            const match = /^#?([0-9a-f]{3,4}|[0-9a-f]{6}|[0-9a-f]{8})$/i.exec(code);
            if (!match) throw new Error(`Invalid color hex code: "${code}".`);
            const digits = match[1].length <= 4
                ? Array.from(match[1], digit => digit + digit).join('')
                : match[1];
            return {
                r: Number.parseInt(digits.slice(0, 2), 16),
                g: Number.parseInt(digits.slice(2, 4), 16),
                b: Number.parseInt(digits.slice(4, 6), 16),
            };
        }

        function applyColorHexCode(code) {
            const tokens = code.trim().split(/[\s,;]+/);
            if (tokens.length !== 1 && tokens.length !== 8 && tokens.length !== 9) {
                throw new Error('Enter one color code or 8–9 codes (one per color control).');
            }
            const colors = tokens.map(parseColorHexCode);
            setSkinGlitchMode(false);
            const colorList = colors.length === 1 ? Array(9).fill(colors[0]) : colors;
            const visibleZoneIndices = [0, 4, 2, 3, 1];
            visibleZoneIndices.forEach((zoneIndex, colorIndex) => {
                const values = { ...colorList[colorIndex] };
                zoneRgbaValues[zoneIndex] = values;
                zoneColors[zoneIndex] = rgbaToHex(values);
                rgbaColorControls.get(`zone-${zoneIndex}`)?.(values);
                currentZoneUniforms[zoneIndex]?.value.copy(colorFromRgba(values));
            });

            let colorIndex = visibleZoneIndices.length;
            if (colors.length === 1 || colors.length === 9) {
                eyeColorRgba = { ...colorList[colorIndex++] };
                rgbaColorControls.get('eye')?.(eyeColorRgba);
                refreshEyeTexture();
            }

            detailColorSettings.forEach(({ key }) => {
                const values = { ...colorList[colorIndex++] };
                detailColors[key] = values;
                rgbaColorControls.get(key)?.(values);
                currentDetailUniforms[key]?.value.copy(colorFromRgba(values));
            });
        }

        async function applySkinPreset(unvalidatedPreset, settings = {}) {
            const preset = validateSkinPreset(unvalidatedPreset);
            speciesSelect.value = preset.species;
            const loaded = await loadSpeciesModel(preset.species);
            if (loaded !== true) throw new Error(`Could not load ${preset.species} for this preset.`);

            let patternIndex = settings.patternIndex ?? null;
            if (patternIndex === null && preset.patternFile) {
                patternIndex = currentPatternChoices.findIndex(choice => choice.file === preset.patternFile);
                if (patternIndex < 0) throw new Error('This skin pattern is not available for the selected species.');
            }
            if (patternIndex !== null && (!Number.isInteger(patternIndex)
                || patternIndex < 0 || patternIndex >= currentPatternChoices.length)) {
                throw new Error(`Pattern ${patternIndex + 1} is not available for ${preset.species}.`);
            }

            setSkinGlitchMode(preset.glitchSkin);
            setGender(preset.gender === 'female');
            setGrowth(preset.growth ?? adultGrowthValue());
            zoneRgbaValues = preset.zones.map(values => ({ ...values }));
            zoneColors = zoneRgbaValues.map(rgbaToHex);
            zoneRgbaValues.forEach((values, index) => {
                rgbaColorControls.get(`zone-${index}`)?.(values);
                currentZoneUniforms[index]?.value.copy(colorFromRgba(values));
            });
            eyeColorRgba = { ...preset.eye };
            rgbaColorControls.get('eye')?.(eyeColorRgba);
            refreshEyeTexture();
            detailColorSettings.forEach(({ key }) => {
                detailColors[key] = { ...preset.details[key] };
                rgbaColorControls.get(key)?.(detailColors[key]);
                currentDetailUniforms[key]?.value.copy(colorFromRgba(detailColors[key]));
            });
            refreshRgbaColorPreviews();

            if (patternIndex !== null) {
                patternSelect.value = String(patternIndex);
                await applyPatternChoice(patternIndex);
            }
            if (settings.patternVariation !== undefined && settings.patternVariation !== null) {
                const noiseTiling = currentSkinMaterial?.userData.skinUniforms?.uNoiseTiling;
                if (noiseTiling) noiseTiling.value = settings.patternVariation;
            }
            if (settings.sunIntensity !== undefined && settings.sunIntensity !== null) {
                sunIntensityInput.value = String(settings.sunIntensity);
                updateLightingControl(sunIntensityInput, sunIntensityValue, value => {
                    directionalLight.intensity = value;
                });
            }
            if (settings.sunAzimuth !== undefined && settings.sunAzimuth !== null) {
                sunAzimuthOffset = THREE.MathUtils.degToRad(settings.sunAzimuth);
            }
            if (preset.name) presetNameInput.value = preset.name;
        }

        async function applyBase64SkinCode(code) {
            const settings = decodeBase64SkinCode(code, base64PatternNumberingSelect.value);
            await applySkinPreset(settings.preset, settings);
        }

        document.getElementById('savePresetButton').addEventListener('click', () => {
            const name = presetNameInput.value.trim();
            if (!name) {
                setPresetStatus('Enter a name for this preset.', true);
                presetNameInput.focus();
                return;
            }
            try {
                const presets = getSavedPresets();
                const preset = getCurrentSkinPreset(name);
                const id = crypto.randomUUID();
                presets.push({ id, name, preset });
                localStorage.setItem(presetStorageKey, JSON.stringify(presets));
                refreshSavedPresetList(id);
                setPresetStatus(`Saved "${name}".`);
            } catch (error) {
                setPresetStatus(`Could not save preset: ${error.message}`, true);
            }
        });

        document.getElementById('loadPresetButton').addEventListener('click', async () => {
            try {
                const preset = getSavedPresets().find(item => item.id === savedPresetSelect.value);
                if (!preset) throw new Error('Choose a saved preset first.');
                const { zones, eye, details, glitchSkin } = preset.preset;
                await applySkinPreset({ ...getCurrentSkinPreset(preset.name), zones, eye, details, glitchSkin });
                setPresetStatus(`Loaded "${preset.name}".`);
            } catch (error) {
                setPresetStatus(`Could not load preset: ${error.message}`, true);
            }
        });

        document.getElementById('deletePresetButton').addEventListener('click', () => {
            try {
                const id = savedPresetSelect.value;
                if (!id) throw new Error('Choose a saved preset first.');
                const presets = getSavedPresets();
                const remaining = presets.filter(preset => preset.id !== id);
                if (remaining.length === presets.length) throw new Error('The selected preset no longer exists.');
                localStorage.setItem(presetStorageKey, JSON.stringify(remaining));
                refreshSavedPresetList();
                setPresetStatus('Preset deleted.');
            } catch (error) {
                setPresetStatus(`Could not delete preset: ${error.message}`, true);
            }
        });

        document.getElementById('exportSkinCodeButton').addEventListener('click', () => {
            try {
                const preset = validateSkinPreset(getCurrentSkinPreset());
                skinCodeOutput.value = encodeSkinCodeForFormat(preset, skinCodeFormatSelect.value);
                const hasExtendedValues = hasExtendedRgbValues(preset);
                const isLimitedFormat = ['oasis-base64', 'color-hex']
                    .includes(skinCodeFormatSelect.value);
                setPresetStatus(
                    hasExtendedValues && isLimitedFormat
                        ? 'Skin code generated, but this format cannot preserve extended RGB values. Choose Extended RGB or SKINHEX1, or NERF Base64 for a NERF glitch skin.'
                        : 'Skin code generated. Copy it to share or back it up.',
                    hasExtendedValues && isLimitedFormat,
                );
            } catch (error) {
                setPresetStatus(`Could not generate skin code: ${error.message}`, true);
            }
        });

        copySkinCodeButton.addEventListener('click', async () => {
            resetSkinCodeActionFeedback(copySkinCodeButton, 'Copy code');
            if (!skinCodeOutput.value) {
                setPresetStatus('Generate a skin code first.', true);
                return;
            }
            try {
                await navigator.clipboard.writeText(skinCodeOutput.value);
                skinCodeOutput.value = '';
                showSkinCodeActionSuccess(copySkinCodeButton, 'Copy code', 'copied to clipboard');
            } catch (error) {
                skinCodeOutput.focus();
                skinCodeOutput.select();
                setPresetStatus('Clipboard access was denied. The code is selected; copy it with Ctrl+C.', true);
            }
        });

        loadSkinCodeButton.addEventListener('click', async () => {
            resetSkinCodeActionFeedback(loadSkinCodeButton, 'Apply skin code');
            try {
                const input = skinCodeInput.value.trim();
                if (/^SKINHEX1:/i.test(input)) {
                    const preset = decodeSkinCode(input);
                    await applySkinPreset(preset);
                } else if (/^RGBX1:/i.test(input)) {
                    const preset = decodeExtendedRgbCode(input);
                    await applySkinPreset(preset);
                } else if (input.startsWith('{')) {
                    const settings = decodeGameSkinJson(input, speciesSelect.value);
                    await applySkinPreset(settings.preset, settings);
                    skinCodeFormatSelect.value = 'nerf-base64';
                    skinCodeOutput.value = encodeSkinCodeForFormat(
                        validateSkinPreset(getCurrentSkinPreset()),
                        'nerf-base64',
                    );
                } else if (/^[A-Za-z0-9+/_-]+={0,2}$/.test(input)) {
                    await applyBase64SkinCode(input);
                } else {
                    applyColorHexCode(input);
                }
                skinCodeInput.value = '';
                showSkinCodeActionSuccess(loadSkinCodeButton, 'Apply skin code', 'Skin code applied');
            } catch (error) {
                setPresetStatus(`Could not apply skin code: ${error.message}`, true);
            }
        });

        try {
            refreshSavedPresetList();
        } catch (error) {
            setPresetStatus(`Could not read saved presets: ${error.message}`, true);
        }

        fetch('mapping.json')
            .then(response => response.json())
            .then(data => {
                console.log("Mapping successfully loaded:", data);
                const controlsContainer = document.getElementById('controls-container');
                
                const zones = data.pattern_zone_definitions;
                if(zones) {
                    zoneColors = Object.keys(zones)
                        .sort((a, b) => zones[a].index - zones[b].index)
                        .map(zoneKey => zones[zoneKey].default_color);
                    zoneRgbaValues = zoneColors.map(rgbaValuesFromHex);
                    const editableZoneOrder = [0, 4, 2, 3, 1];
                    editableZoneOrder.forEach((zoneIndex, displayIndex) => {
                        const zone = Object.values(zones).find(item => item.index === zoneIndex);
                        if (!zone) throw new Error(`Missing color-zone configuration for index ${zoneIndex}.`);
                        const zoneControl = createRgbaColorControl(
                            controlsContainer,
                            `zone-${zone.index}`,
                            zone.label,
                            zoneRgbaValues[zone.index],
                            values => {
                            zoneRgbaValues[zone.index] = values;
                            zoneColors[zone.index] = rgbaToHex(values);
                            currentZoneUniforms[zone.index]?.value.copy(colorFromRgba(values));
                            if (zoneIndex === 4) refreshEyeTexture();
                            },
                        );
                        if (zone.index === 0) {
                            maleDisplayZoneControl = zoneControl;
                            setGender(isFemale);
                        }
                    });
                }

                createRgbaColorControl(controlsContainer, 'eye', 'Eye Color', eyeColorRgba, values => {
                    eyeColorRgba = values;
                    refreshEyeTexture();
                });

                detailColorSettings.forEach(({ key, label }) => {
                    createRgbaColorControl(controlsContainer, key, label, detailColors[key], values => {
                        detailColors[key] = values;
                        currentDetailUniforms[key]?.value.copy(colorFromRgba(values));
                    });
                });

                if (modelLoadRequest === 0) {
                    speciesSelect.value = "Carnotaurus";
                    loadSpeciesModel("Carnotaurus");
                }
            })
            .catch(err => console.error("Error loading mapping.json:", err));

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 1 / 20);
            if (currentMixer) currentMixer.update(delta);
            controls.update();
            const azimuth = Math.atan2(
                camera.position.x - controls.target.x,
                camera.position.z - controls.target.z,
            ) + sunAzimuthOffset;
            lightYaw.setFromAxisAngle(lightYawAxis, azimuth);
            rotatedSunDirection.copy(sunDirection).applyQuaternion(lightYaw);
            rotatedFillDirection.copy(fillDirection).applyQuaternion(lightYaw);
            sunCenter.copy(controls.target);
            directionalLight.position.copy(sunCenter).addScaledVector(rotatedSunDirection, keyLightDistance);
            directionalLight.target.position.copy(sunCenter);
            fillLight.position.copy(sunCenter).addScaledVector(rotatedFillDirection, 100);
            fillLight.target.position.copy(sunCenter);
            renderer.render(scene, camera);
        }
        animate();

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) clock.stop();
            else clock.start();
        });

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>

</body>
</html>
